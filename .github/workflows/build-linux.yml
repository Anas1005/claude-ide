name: Build Linux

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Attach the Linux tarball and the Remote Agent VSIX to this existing release (for example v0.6.2). Leave empty to only produce downloads on the run page.
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Linux x64
    # 22.04 (glibc 2.35) so the build also runs on older office Linux VMs.
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Free disk space (Code - OSS sources, dependencies and build output need room)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build dependencies of Code - OSS and launch-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ make pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev \
            xvfb libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libatk-bridge2.0-0 dbus-x11

      - name: Extension dependencies
        run: |
          npm ci --prefix claude-agent
          npm ci --prefix claude-agent-remote

      - name: Remote Agent tests (compiles out/, used by the Local Agent's remote tests)
        working-directory: claude-agent-remote
        run: npm test

      - name: Local Agent type check and tests
        working-directory: claude-agent
        run: |
          npm run typecheck
          npm test

      # Native modules are compiled against Electron's headers. Like Microsoft's own Linux CI
      # (vscode-fork/build/azure-pipelines/linux/product-build-linux-node-modules.yml), use the pinned source's
      # setup-env.sh: Chromium clang + Electron's libc++ + a glibc 2.28 sysroot, not the runner's system GCC.
      - name: Code - OSS at the pinned commit (build.mjs verifies and reuses this checkout)
        run: |
          COMMIT=$(grep -o "VSCODE_COMMIT = '[0-9a-f]\{40\}'" scripts/build.mjs | grep -o '[0-9a-f]\{40\}')
          test -n "$COMMIT"
          mkdir vscode-fork
          cd vscode-fork
          git init -q
          git remote add origin https://github.com/microsoft/vscode.git
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth 1 origin "$COMMIT"
          git -c filter.lfs.smudge= -c filter.lfs.process= -c filter.lfs.required=false checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$COMMIT"

      # Every Electron release asset the Linux build downloads comes from
      # https://github.com/electron/electron/releases/download/v<version>/<file>, which returns 504 for most assets of
      # this release. The complete list, traced in the pinned source:
      #   setup-env.sh -> build/linux/libcxx-fetcher.ts (@electron/get 2):  libcxx-objects-v<V>-linux-x64.zip,
      #                                                    libcxx_headers.zip, libcxxabi_headers.zip (+ SHASUMS256.txt)
      #   npm ci postinstall -> build/npm/electronTypes.ts (fetch):          electron.d.ts
      #   gulp -> @vscode/gulp-electron (@electron/get 5; ffmpegChromium is off, no symbols, no artifact feed):
      #                                                                      electron-v<V>-linux-x64.zip (+ SHASUMS256.txt)
      # Fetch them through the GitHub API instead (cached across runs), each checked against the pinned
      # build/checksums/electron.txt. electronTypes.ts takes electron.d.ts from its own cache file, .build/typings/electron.d.ts.
      # @electron/get's cache can't cover it: version 5 always downloads SHASUMS256.txt again (cacheMode Bypass), so
      # the build step serves this folder on localhost and points both @electron/get versions at it with
      # ELECTRON_MIRROR; they still verify every file against the served SHASUMS256.txt.
      - name: Electron version
        id: electron
        run: echo "version=$(sed -n 's/^target="\(.*\)"$/\1/p' vscode-fork/.npmrc)" >> "$GITHUB_OUTPUT"

      - name: Restore Electron download cache
        id: electron-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/electron-mirror
          key: electron-mirror-linux-x64-${{ steps.electron.outputs.version }}-${{ hashFiles('vscode-fork/build/checksums/electron.txt') }}

      # Runs on a cache hit too: files already present and matching the pinned checksums are skipped, anything
      # missing or wrong is downloaded, so an incomplete cache can't break the build.
      - name: Prefetch Electron release assets through the GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.electron.outputs.version }}
        run: |
          test -n "$V"
          PINNED="$PWD/vscode-fork/build/checksums/electron.txt"
          pinned() { awk -v f="*$1" '$2 == f { print $1 }' "$PINNED"; }
          ok() { [ -f "$DIR/$1" ] && [ "$(sha256sum "$DIR/$1" | cut -d' ' -f1)" = "$(pinned "$1")" ]; }
          # SHASUMS256.txt isn't in the pinned list: it is right if it agrees with it for every file below.
          sums_ok() { [ -f "$DIR/SHASUMS256.txt" ] && for g in $FILES; do
            [ "$(awk -v f="*$g" '$2 == f { print $1 }' "$DIR/SHASUMS256.txt")" = "$(pinned "$g")" ] || return 1; done; }
          fetch() {
            for i in 1 2 3 4 5; do
              gh release download "v$V" --repo electron/electron --pattern "$1" --dir "$DIR" --clobber && return 0
              if [ "$i" = 5 ]; then echo "Could not download $1" >&2; exit 1; fi
              sleep $((5 * 2 ** i))
            done
          }
          FILES="libcxx-objects-v$V-linux-x64.zip libcxx_headers.zip libcxxabi_headers.zip electron.d.ts electron-v$V-linux-x64.zip"
          for f in $FILES; do test -n "$(pinned "$f")" || { echo "$f is not in $PINNED" >&2; exit 1; }; done
          # Same layout as the release download URL: <mirror>/v<version>/<file>.
          DIR="$HOME/electron-mirror/v$V"
          mkdir -p "$DIR"
          for f in $FILES; do
            if ok "$f"; then echo "cached: $f"; continue; fi
            fetch "$f"
            ok "$f" || { echo "$f does not match $PINNED" >&2; exit 1; }
          done
          if ! sums_ok; then fetch SHASUMS256.txt; sums_ok || { echo "SHASUMS256.txt disagrees with $PINNED" >&2; exit 1; }; fi
          # electronTypes.ts skips its download when this file exists with the pinned checksum.
          mkdir -p vscode-fork/.build/typings
          cp "$DIR/electron.d.ts" vscode-fork/.build/typings/electron.d.ts

      - name: Save Electron download cache
        if: steps.electron-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/electron-mirror
          key: electron-mirror-linux-x64-${{ steps.electron.outputs.version }}-${{ hashFiles('vscode-fork/build/checksums/electron.txt') }}

      - name: Code - OSS build-script dependencies (needed by setup-env.sh)
        working-directory: vscode-fork/build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci

      - name: Build Claude IDE with the Code - OSS Linux toolchain (applies patches, builds the tarball)
        env:
          VSCODE_ARCH: x64
          npm_config_arch: x64
          GITHUB_TOKEN: ${{ github.token }}
          V: ${{ steps.electron.outputs.version }}
          # The app's identity on remote hosts (~/.claude-ide-server/bin/<commit>): one per build, so an upgrade installs its own server.
          BUILD_SOURCEVERSION: ${{ github.sha }}
        run: |
          # The prefetched Electron release assets, served locally for @electron/get (see the prefetch step).
          python3 -m http.server 8597 --bind 127.0.0.1 --directory "$HOME/electron-mirror" > /dev/null 2>&1 &
          trap "kill $! 2> /dev/null" EXIT
          MIRROR_PID=$!
          for i in $(seq 30); do
            curl -fsI "http://127.0.0.1:8597/v$V/SHASUMS256.txt" > /dev/null && break
            if ! kill -0 "$MIRROR_PID" 2> /dev/null; then
              echo "The local Electron mirror (python3 -m http.server on 127.0.0.1:8597) exited while starting. Is the port already in use?" >&2
              exit 1
            fi
            if [ "$i" = 30 ]; then
              echo "The local Electron mirror did not serve http://127.0.0.1:8597/v$V/SHASUMS256.txt within 30 seconds." >&2
              echo "Check that the prefetch step filled $HOME/electron-mirror/v$V:" >&2
              ls -la "$HOME/electron-mirror/v$V" >&2 || true
              exit 1
            fi
            sleep 1
          done
          export ELECTRON_MIRROR=http://127.0.0.1:8597/
          # One shell: setup-env.sh exports CC, CXX, CXXFLAGS and LDFLAGS (and writes ~/.gyp/include.gypi), and they
          # apply to everything below, including the npm ci of Code - OSS that build.mjs runs before gulp.
          cd vscode-fork
          source build/azure-pipelines/linux/setup-env.sh
          case "$CC" in *CR_Clang/bin/clang*) echo "CC=$CC" ;; *) echo "Chromium clang is not set up (CC=$CC)" >&2; exit 1 ;; esac
          # As Microsoft's pipeline does: install the Electron headers and Code - OSS's header overlay before
          # npm ci, so native modules are never compiled against unpatched headers.
          node build/npm/preinstall.ts
          cd ..
          node scripts/build.mjs --arch x64 --package

      - name: Check the bundled Remote-SSH server (Remote Agent inside, same commit as the app, starts)
        run: |
          TAR="$PWD/VSCode-linux-x64/resources/app/server/vscode-server-linux-x64.tar.gz"
          ls -la "$TAR"
          APP_COMMIT=$(node -p "require('./VSCode-linux-x64/resources/app/product.json').commit")
          test "$APP_COMMIT" = "$GITHUB_SHA"
          DIR=$(mktemp -d)
          cd "$DIR"
          tar -xzf "$TAR"
          S=vscode-server-linux-x64
          test -f "$S/extensions/claude-agent-remote/out/extension.js"
          test "$(node -p "require('./$S/product.json').commit")" = "$APP_COMMIT"
          "$S/bin/claude-ide-server" --start-server --host=127.0.0.1 --port=0 --without-connection-token --accept-server-license-terms > server.log 2>&1 &
          for i in $(seq 30); do grep -q 'Extension host agent listening on' server.log && break; sleep 1; done
          grep 'Extension host agent listening on' server.log || { cat server.log >&2; exit 1; }
          pkill -f "$DIR/$S/out/server-main.js"

      - name: Launch test (window opens, Claude panel loads, no warnings)
        run: xvfb-run -a node scripts/smoke-test.mjs --arch x64

      - name: Package the Remote Agent VSIX
        working-directory: claude-agent-remote
        run: |
          npm run package
          VERSION=$(node -p "require('./package.json').version")
          unzip -l "claude-agent-remote-$VERSION.vsix" | grep -q 'extension/out/extension.js'
          unzip -p "claude-agent-remote-$VERSION.vsix" extension/package.json | grep -q "\"version\": \"$VERSION\""

      - name: Upload Linux tarball, Remote Agent VSIX and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Claude-IDE-Linux-x64
          path: |
            release/*Linux*.tar.gz
            claude-agent-remote/claude-agent-remote-*.vsix
            smoke/*.png
          if-no-files-found: ignore
          compression-level: 0

      - name: Attach to release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag || github.ref_name }}" release/*Linux*.tar.gz claude-agent-remote/claude-agent-remote-*.vsix --clobber
