name: Build Linux

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Attach the Linux tarball and the Remote Agent VSIX to this existing release (for example v0.6.2). Leave empty to only produce downloads on the run page.
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Linux x64
    # 22.04 (glibc 2.35) so the build also runs on older office Linux VMs.
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Free disk space (Code - OSS sources, dependencies and build output need room)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build dependencies of Code - OSS and launch-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ make pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev \
            xvfb libgtk-3-0 libnss3 libasound2 libgbm1 libxss1 libatk-bridge2.0-0 dbus-x11

      - name: Extension dependencies
        run: |
          npm ci --prefix claude-agent
          npm ci --prefix claude-agent-remote

      - name: Remote Agent tests (compiles out/, used by the Local Agent's remote tests)
        working-directory: claude-agent-remote
        run: npm test

      - name: Local Agent type check and tests
        working-directory: claude-agent
        run: |
          npm run typecheck
          npm test

      # Native modules are compiled against Electron's headers. Like Microsoft's own Linux CI
      # (vscode-fork/build/azure-pipelines/linux/product-build-linux-node-modules.yml), use the pinned source's
      # setup-env.sh: Chromium clang + Electron's libc++ + a glibc 2.28 sysroot, not the runner's system GCC.
      - name: Code - OSS at the pinned commit (build.mjs verifies and reuses this checkout)
        run: |
          COMMIT=$(grep -o "VSCODE_COMMIT = '[0-9a-f]\{40\}'" scripts/build.mjs | grep -o '[0-9a-f]\{40\}')
          test -n "$COMMIT"
          mkdir vscode-fork
          cd vscode-fork
          git init -q
          git remote add origin https://github.com/microsoft/vscode.git
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth 1 origin "$COMMIT"
          git -c filter.lfs.smudge= -c filter.lfs.process= -c filter.lfs.required=false checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$COMMIT"

      # Electron release assets (Electron's libc++ for setup-env.sh's libcxx-fetcher, the Electron zip for gulp) are
      # fetched by @electron/get from https://github.com/electron/electron/releases/download/v<version>/…, which
      # returns 504 for most assets of this release, and @electron/get's stream download never retries. Fetch the
      # same files through the GitHub API into @electron/get's own cache instead; it then uses them and still
      # verifies them against the release's SHASUMS256.txt. Cached across runs.
      - name: Electron version
        id: electron
        run: echo "version=$(sed -n 's/^target="\(.*\)"$/\1/p' vscode-fork/.npmrc)" >> "$GITHUB_OUTPUT"

      - name: Restore Electron download cache
        id: electron-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/electron
          key: electron-assets-linux-x64-${{ steps.electron.outputs.version }}

      - name: Prefetch Electron release assets through the GitHub API
        if: steps.electron-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.electron.outputs.version }}
        run: |
          test -n "$V"
          # @electron/get's cache folder for these URLs: sha256 of the release download URL without the file name.
          DIR="$HOME/.cache/electron/$(printf %s "https://github.com/electron/electron/releases/download/v$V" | sha256sum | cut -d' ' -f1)"
          mkdir -p "$DIR"
          for f in SHASUMS256.txt "libcxx-objects-v$V-linux-x64.zip" libcxx_headers.zip libcxxabi_headers.zip "electron-v$V-linux-x64.zip"; do
            for i in 1 2 3 4 5; do
              gh release download "v$V" --repo electron/electron --pattern "$f" --dir "$DIR" --clobber && break
              if [ "$i" = 5 ]; then echo "Could not download $f" >&2; exit 1; fi
              sleep $((5 * 2 ** i))
            done
          done
          cd "$DIR"
          grep -E " \*(libcxx-objects-v$V-linux-x64\.zip|libcxx_headers\.zip|libcxxabi_headers\.zip|electron-v$V-linux-x64\.zip)$" SHASUMS256.txt > expected.sha256
          test "$(wc -l < expected.sha256)" = 4
          sha256sum -c expected.sha256
          rm expected.sha256

      - name: Save Electron download cache
        if: steps.electron-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/electron
          key: electron-assets-linux-x64-${{ steps.electron.outputs.version }}

      - name: Code - OSS build-script dependencies (needed by setup-env.sh)
        working-directory: vscode-fork/build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci

      - name: Build Claude IDE with the Code - OSS Linux toolchain (applies patches, builds the tarball)
        env:
          VSCODE_ARCH: x64
          npm_config_arch: x64
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # One shell: setup-env.sh exports CC, CXX, CXXFLAGS and LDFLAGS (and writes ~/.gyp/include.gypi), and they
          # apply to everything below, including the npm ci of Code - OSS that build.mjs runs before gulp.
          cd vscode-fork
          source build/azure-pipelines/linux/setup-env.sh
          case "$CC" in *CR_Clang/bin/clang*) echo "CC=$CC" ;; *) echo "Chromium clang is not set up (CC=$CC)" >&2; exit 1 ;; esac
          # As Microsoft's pipeline does: install the Electron headers and Code - OSS's header overlay before
          # npm ci, so native modules are never compiled against unpatched headers.
          node build/npm/preinstall.ts
          cd ..
          node scripts/build.mjs --arch x64 --package

      - name: Launch test (window opens, Claude panel loads, no warnings)
        run: xvfb-run -a node scripts/smoke-test.mjs --arch x64

      - name: Package the Remote Agent VSIX
        working-directory: claude-agent-remote
        run: |
          npm run package
          VERSION=$(node -p "require('./package.json').version")
          unzip -l "claude-agent-remote-$VERSION.vsix" | grep -q 'extension/out/extension.js'
          unzip -p "claude-agent-remote-$VERSION.vsix" extension/package.json | grep -q "\"version\": \"$VERSION\""

      - name: Upload Linux tarball, Remote Agent VSIX and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Claude-IDE-Linux-x64
          path: |
            release/*Linux*.tar.gz
            claude-agent-remote/claude-agent-remote-*.vsix
            smoke/*.png
          if-no-files-found: ignore
          compression-level: 0

      - name: Attach to release
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag || github.ref_name }}" release/*Linux*.tar.gz claude-agent-remote/claude-agent-remote-*.vsix --clobber
